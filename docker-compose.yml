services:
  backend:
    build: ./backend
    image: minidb-backend
    container_name: minidb-backend
    environment:
      DATA_DIR: /data
      DATASETS_DIR: /datasets
    volumes:
      - minidb-data:/data
      - ./datasets:/datasets:z
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Se toma del .env de la raíz (gitignoreado); vacío = sin key
        VITE_CARTO_API_KEY: ${CARTO_API_KEY:-}
    image: minidb-frontend
    container_name: minidb-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  minidb-data:
