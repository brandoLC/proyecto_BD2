services:
  backend:
    build: ./backend
    image: minidb-backend
    container_name: minidb-backend
    environment:
      DATA_DIR: /data
      DATASETS_DIR: /datasets
    volumes:
      - minidb-data:/data
      - ./datasets:/datasets:z
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: minidb-frontend
    container_name: minidb-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  minidb-data:
